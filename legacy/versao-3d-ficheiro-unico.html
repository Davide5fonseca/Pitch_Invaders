<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invasão de Campo 3D</title>
<style>
  :root { --gold: #ffd166; --pink: #c14bff; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1424; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; align-items: center;
    padding: 8px 18px; background: rgba(5,10,20,.65); border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
    backdrop-filter: blur(6px); white-space: nowrap; }
  .hidden { display: none !important; }
  .stat { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
  .stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; opacity: .7; text-transform: uppercase; letter-spacing: .06em; }
  .bar { width: 90px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin: 6px 0 4px; }
  .bar i { display: block; height: 100%; width: 100%; background: #4ade80; }
  #dash { width: 24px; height: 24px; border-radius: 50%; background: var(--pink); }
  #map { position: fixed; right: 14px; bottom: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.45); }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;

  h1 { font-size: clamp(36px, 7vw, 72px); margin: 0 0 8px; color: var(--gold); text-shadow: 0 4px 20px rgba(0,0,0,.6); }
  h1.red { color: #f87171; }
  .card p { margin: 6px 0; font-size: 17px; opacity: .9; }
  .big { font-size: 40px !important; font-weight: 900; opacity: 1 !important; }
  .rules { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 14px; text-align: left; margin: 20px auto; max-width: 520px; font-size: 16px; }
  .rules em { color: #7cf29c; font-style: normal; font-weight: 800; text-align: right; }
  .keys { font-size: 14px !important; opacity: .7 !important; }
  .cta { margin-top: 22px; font-size: 24px; font-weight: 800; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .float { position: fixed; left: 0; top: 0; font-weight: 900; font-size: 24px; pointer-events: none; white-space: nowrap;
    text-shadow: 0 2px 6px #000, 0 0 2px #000; }
  .float.huge { font-size: 56px; }
  #camBtn { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 10px;
    padding: 7px 12px; font: 700 14px system-ui, sans-serif; cursor: pointer; }
  #camBtn:hover { background: rgba(255,255,255,.2); }
  .fx { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #vig { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.85) 100%); }
  #tired { background: radial-gradient(ellipse at center, transparent 45%, rgba(150,0,0,.85) 100%); transition: none; }
  #gopro { position: fixed; top: 16px; left: 16px; display: flex; gap: 14px; font: 700 15px ui-monospace, Consolas, monospace;
    text-shadow: 0 1px 3px #000; pointer-events: none; }
  #gopro .rec { color: #ff3b30; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #warn { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); color: #ff5252; font-size: 24px; font-weight: 900;
    text-shadow: 0 2px 8px #000; pointer-events: none; animation: pulse .5s ease-in-out infinite; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); box-sizing: border-box;
    padding: 10px 16px; border-radius: 12px; background: rgba(5,10,20,.85); border: 1px solid rgba(255,255,255,.15);
    font-size: 15px; text-align: center; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }
  @media (max-width: 700px) {
    #hud { gap: 10px; padding: 6px 10px; top: 6px; }
    .stat b { font-size: 15px; } .stat span { font-size: 9px; }
    .bar { width: 50px; }
    #map { width: 150px; height: auto; }
  }
</style>

<div id="tired" class="fx"></div>

  <div class="stat"><b id="sScore">0</b><span>Pontos</span></div>

</div>
<canvas id="map" class="hidden" width="226" height="152"></canvas>

<div id="toast"></div>
<div id="overlay"><div class="card"><h1>INVASÃO DE CAMPO</h1><p>A carregar os jogadores…</p></div></div>
<div id="flash"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const lerpAngle = (a, b, t) => a + ((((b - a + Math.PI) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) - Math.PI) * t;

// Medidas reais em metros
const HL = 52.5, HW = 34, GOAL_W = 3.66, BR = 0.24;
const COLORS = { home: '#d0202a', away: '#f4f4f4', ref: '#1a1a1a', invader: '#c14bff', steward: '#ffcc00', police: '#1f3a93' };
const RUN = 6.8, SPRINT = 9.2, DASH = 17, DASH_TIME = 0.18, DASH_CD = 1.3;
const MODEL_URLS = [
  'https://threejs.org/examples/models/gltf/Xbot.glb',
  'https://raw.githubusercontent.com/mrdoob/three.js/r170/examples/models/gltf/Xbot.glb',
];

// ---------- Renderer / cena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a1424');
scene.fog = new THREE.Fog('#0a1424', 110, 260);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 600);

// Lente olho-de-peixe da GoPro (pós-processamento)
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const fisheye = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, k: { value: 0.18 }, aspect: { value: innerWidth / innerHeight } },
  vertexShader: `varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float k; uniform float aspect; varying vec2 vUv;
    void main() {
      vec2 p = vUv * 2.0 - 1.0;
      p.x *= aspect;
      float r2 = dot(p, p), m2 = aspect * aspect + 1.0;
      vec2 q = p * (1.0 + k * r2) / (1.0 + k * m2);
      q.x /= aspect;
      vec4 c = texture2D(tDiffuse, q * 0.5 + 0.5);
      float v = smoothstep(1.05, 0.6, sqrt(r2 / m2));
      gl_FragColor = vec4(c.rgb * v, c.a);
    }`,
});
composer.addPass(fisheye);
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  fisheye.uniforms.aspect.value = innerWidth / innerHeight;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

// Modos de câmara
const CAM_MODES = [
  { id: 'tv', name: 'TV', fov: 50 },
  { id: 'ombro', name: 'Ombro', fov: 65 },
  { id: 'peito', name: 'GoPro peito', fov: 110 },
  { id: 'cabeca', name: 'Cabeça', fov: 78 },
];
let camMode = 0, yaw = Math.PI, pitch = 0, bobPh = 0, lastPointerType = 'mouse';
try { camMode = clamp(Math.floor(+localStorage.getItem('invasao3d-cam') || 0), 0, CAM_MODES.length - 1); } catch (e) {}
const mode = () => CAM_MODES[camMode].id;
const relControls = () => mode() !== 'tv';                         // controlos relativos ao olhar
const firstPerson = () => mode() === 'peito' || mode() === 'cabeca';

scene.add(new THREE.HemisphereLight('#cfe0ff', '#24402a', 1.2));
const sun = new THREE.DirectionalLight('#ffffff', 2.8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 140 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// ---------- Texturas ----------
function canvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function texture(c, repeat) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}

function pitchTexture() {
  const S = 16, M = 4;
  const [c, g] = canvas((105 + 2 * M) * S, (68 + 2 * M) * S);
  const X = x => (x + HL + M) * S, Y = z => (z + HW + M) * S;
  g.fillStyle = '#2d7a31'; g.fillRect(0, 0, c.width, c.height);
  const n = 14;
  for (let i = 0; i < n; i++) {
    g.fillStyle = i % 2 ? '#358c39' : '#2d7a31';
    g.fillRect(X(-HL + i * 105 / n), 0, 105 / n * S, c.height);
  }
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.fillStyle = '#fff'; g.lineWidth = 0.12 * S;
  const circle = (x, z, r) => { g.beginPath(); g.arc(X(x), Y(z), r * S, 0, Math.PI * 2); g.stroke(); };
  const dot = (x, z) => { g.beginPath(); g.arc(X(x), Y(z), 0.2 * S, 0, Math.PI * 2); g.fill(); };
  g.strokeRect(X(-HL), Y(-HW), 105 * S, 68 * S);
  g.beginPath(); g.moveTo(X(0), Y(-HW)); g.lineTo(X(0), Y(HW)); g.stroke();
  circle(0, 0, 9.15); dot(0, 0);
  for (const s of [-1, 1]) {
    const gx = s * HL;
    g.strokeRect(Math.min(X(gx), X(gx - s * 16.5)), Y(-20.16), 16.5 * S, 40.32 * S);
    g.strokeRect(Math.min(X(gx), X(gx - s * 5.5)), Y(-9.16), 5.5 * S, 18.32 * S);
    dot(gx - s * 11, 0);
    g.save();
    g.beginPath();
    g.rect(s < 0 ? X(gx + 16.5) : 0, 0, s < 0 ? c.width : X(gx - 16.5), c.height);
    g.clip();
    circle(gx - s * 11, 0, 9.15);
    g.restore();
    for (const z of [-HW, HW]) { g.beginPath(); g.arc(X(gx), Y(z), 1 * S, 0, Math.PI * 2); g.stroke(); }
  }
  return texture(c);
}

function crowdTexture() {
  const [c, g] = canvas(512, 256);
  g.fillStyle = '#151820'; g.fillRect(0, 0, 512, 256);
  const shirts = ['#d0202a', '#d0202a', '#f4f4f4', '#1e3a8a', '#ffb703', '#2a9d8f', '#e76f51', '#8ecae6', '#222'];
  const skins = ['#f1c27d', '#e0ac69', '#c68642', '#8d5524', '#ffdbac'];
  for (let row = 0, y = 8; y < 256; y += 12, row++) {
    for (let x = 4 + (row % 2) * 5; x < 512; x += 10) {
      if (Math.random() < 0.08) continue;
      const jx = x + rand(-1.5, 1.5);
      g.fillStyle = shirts[Math.floor(Math.random() * shirts.length)];
      g.fillRect(jx - 3.5, y, 7, 7);
      g.fillStyle = skins[Math.floor(Math.random() * skins.length)];
      g.beginPath(); g.arc(jx, y - 1.5, 2.7, 0, Math.PI * 2); g.fill();
    }
  }
  return c;
}

function adCanvas() {
  const [c, g] = canvas(1024, 64);
  const ads = [['#0b3d91', 'INVASÃO FC'], ['#d0202a', 'GOLO TV'], ['#111', 'SUPER BOLA'], ['#f4a300', 'RELVADO+']];
  ads.forEach(([bg, txt], i) => {
    g.fillStyle = bg; g.fillRect(i * 256, 0, 256, 64);
    g.fillStyle = '#fff'; g.font = '900 34px system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(txt, i * 256 + 128, 34);
  });
  return c;
}

function ballTexture() {
  const [c, g] = canvas(256, 128);
  g.fillStyle = '#fff'; g.fillRect(0, 0, 256, 128);
  g.fillStyle = '#151515';
  for (const [x, y] of [[0, 64], [64, 20], [64, 108], [128, 64], [192, 20], [192, 108], [256, 64]]) {
    g.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2 - Math.PI / 2;
      g.lineTo(x + Math.cos(a) * 16, y + Math.sin(a) * 16);
    }
    g.fill();
  }
  return texture(c);
}

function netTexture() {
  const [c, g] = canvas(32, 32);
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2;
  g.strokeRect(1, 1, 30, 30);
  return texture(c, [1, 1]);
}

// ---------- Estádio ----------
const standTexs = [];
function buildStadium() {
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(260, 200), new THREE.MeshLambertMaterial({ color: '#1d5a22' }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; ground.receiveShadow = true;
  scene.add(ground);

  const pitch = new THREE.Mesh(new THREE.PlaneGeometry(113, 76), new THREE.MeshLambertMaterial({ map: pitchTexture() }));
  pitch.rotation.x = -Math.PI / 2; pitch.receiveShadow = true;
  scene.add(pitch);

  // Bancadas inclinadas com público
  const crowdC = crowdTexture();
  const stand = (len, distance, yaw) => {
    const D = 32, tilt = THREE.MathUtils.degToRad(55);
    const tex = texture(crowdC, [len / 9, D / 6]);
    standTexs.push(tex);
    const g = new THREE.Group();
    const m = new THREE.Mesh(new THREE.PlaneGeometry(len, D), new THREE.MeshLambertMaterial({ map: tex }));
    m.rotation.x = -tilt;
    m.position.set(0, 1.2 + D / 2 * Math.cos(tilt), -distance - D / 2 * Math.sin(tilt));
    g.add(m);
    const wall = new THREE.Mesh(new THREE.BoxGeometry(len, 1.2, 0.4), new THREE.MeshStandardMaterial({ color: '#1b2433' }));
    wall.position.set(0, 0.6, -distance + 0.2);
    g.add(wall);
    g.rotation.y = yaw;
    scene.add(g);
  };
  stand(150, 41, 0); stand(150, 41, Math.PI);
  stand(100, 60, -Math.PI / 2); stand(100, 60, Math.PI / 2);

  // Placards de publicidade
  const adC = adCanvas();
  const board = (len, distance, yaw) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(len, 0.9, 0.12), new THREE.MeshBasicMaterial({ map: texture(adC, [len / 30, 1]) }));
    m.position.set(0, 0.45, -distance);
    const g = new THREE.Group(); g.add(m); g.rotation.y = yaw;
    scene.add(g);
  };
  board(113, 38.5, 0); board(113, 38.5, Math.PI);
  board(78, 57.5, -Math.PI / 2); board(78, 57.5, Math.PI / 2);

  // Balizas
  const white = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: .4 });
  const netMat = new THREE.MeshBasicMaterial({ map: netTexture(), transparent: true, side: THREE.DoubleSide, depthWrite: false });
  for (const s of [-1, 1]) {
    const g = new THREE.Group();
    const post = new THREE.CylinderGeometry(0.06, 0.06, 2.44, 10);
    for (const z of [-GOAL_W, GOAL_W]) {
      const p = new THREE.Mesh(post, white); p.position.set(0, 1.22, z); p.castShadow = true; g.add(p);
    }
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, GOAL_W * 2, 10), white);
    bar.rotation.x = Math.PI / 2; bar.position.y = 2.44; bar.castShadow = true; g.add(bar);
    const net = (w, h, rep, setup) => {
      const mat = netMat.clone(); mat.map = netMat.map.clone(); mat.map.repeat.set(...rep);
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); setup(m); g.add(m);
    };
    net(GOAL_W * 2, 2.44, [30, 10], m => { m.rotation.y = Math.PI / 2; m.position.set(2, 1.22, 0); });
    net(2, GOAL_W * 2, [8, 30], m => { m.rotation.x = -Math.PI / 2; m.position.set(1, 2.44, 0); });
    for (const z of [-GOAL_W, GOAL_W]) net(2, 2.44, [8, 10], m => { m.position.set(1, 1.22, z); });
    g.position.x = s * HL;
    g.rotation.y = s > 0 ? 0 : Math.PI;
    scene.add(g);
  }

  // Bandeirolas de canto
  const flagMat = new THREE.MeshBasicMaterial({ color: '#ffd166', side: THREE.DoubleSide });
  for (const x of [-HL, HL]) for (const z of [-HW, HW]) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.5), white);
    pole.position.set(x, 0.75, z);
    const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.45, 0.3), flagMat);
    flag.position.set(x + 0.22, 1.35, z);
    scene.add(pole, flag);
  }

  // Torres de iluminação
  const poleMat = new THREE.MeshStandardMaterial({ color: '#555b66' });
  const lampMat = new THREE.MeshBasicMaterial({ color: '#fff8e0' });
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.7, 45, 8), poleMat);
    pole.position.set(sx * 78, 22.5, sz * 66);
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(9, 4, 0.6), lampMat);
    lamp.position.set(sx * 78, 45, sz * 66);
    lamp.lookAt(0, 0, 0);
    scene.add(pole, lamp);
  }
}

// ---------- Bonecos ----------
let xbot = null;
async function loadXbot() {
  const loader = new GLTFLoader();
  for (const url of MODEL_URLS) {
    try {
      const gltf = await loader.loadAsync(url);
      gltf.scene.updateMatrixWorld(true);
      const h = new THREE.Box3().setFromObject(gltf.scene).getSize(new THREE.Vector3()).y;
      return { scene: gltf.scene, animations: gltf.animations, scale: h > 0.05 ? 1.8 / h : 1 };
    } catch (e) {
      console.warn('Não foi possível carregar', url, e);
    }
  }
  return null;
}

// Boneco animado (modelo Mixamo com animações idle/walk/run)
function makeXbot(color) {
  const model = SkeletonUtils.clone(xbot.scene);
  model.scale.setScalar(xbot.scale);
  const bodyMats = [], jointMats = [];
  model.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.frustumCulled = false;
    o.material = o.material.clone();
    o.material.metalness = 0.05;
    o.material.roughness = 0.55;
    (/joint/i.test(o.name + o.material.name) ? jointMats : bodyMats).push(o.material);
  });
  const root = new THREE.Group();
  root.add(model);
  const mixer = new THREE.AnimationMixer(model);
  const act = name => {
    const clip = THREE.AnimationClip.findByName(xbot.animations, name);
    if (!clip) return null;
    const a = mixer.clipAction(clip);
    a.play(); a.setEffectiveWeight(0);
    a.time = Math.random() * clip.duration;
    return a;
  };
  const idle = act('idle'), walk = act('walk'), run = act('run') || walk;
  const setColor = c => {
    const col = new THREE.Color(c);
    bodyMats.forEach(m => m.color.copy(col));
    jointMats.forEach(m => m.color.copy(col).multiplyScalar(0.3));
  };
  setColor(color);
  return {
    root, setColor,
    update(dt, s) {
      const wI = clamp(1 - s / 1.6, 0, 1), wR = clamp((s - 2.2) / 2.8, 0, 1), wW = clamp(1 - wI - wR, 0, 1);
      if (idle) idle.setEffectiveWeight(wI);
      if (walk) { walk.setEffectiveWeight(walk === run ? wW + wR : wW); walk.timeScale = clamp(s / 1.5, 0.6, 1.8); }
      if (run && run !== walk) { run.setEffectiveWeight(wR); run.timeScale = clamp(s / 5.5, 0.8, 1.7); }
      mixer.update(dt);
    },
  };
}

// Boneco simples de reserva, caso o modelo não carregue (sem internet)
function makeProcedural(color) {
  const shirt = new THREE.MeshStandardMaterial({ color, roughness: .7 });
  const shorts = new THREE.MeshStandardMaterial({ color: '#20232a', roughness: .8 });
  const skin = new THREE.MeshStandardMaterial({ color: '#e0b18a', roughness: .8 });
  const root = new THREE.Group(), body = new THREE.Group();
  root.add(body);
  const box = (w, h, d, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = true; return m; };
  const torso = box(.48, .62, .26, shirt); torso.position.y = 1.22; body.add(torso);
  const hips = box(.46, .24, .28, shorts); hips.position.y = .84; body.add(hips);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.14, 16, 12), skin);
  head.position.y = 1.7; head.castShadow = true; body.add(head);
  const limb = (x, y, w, len, mat) => {
    const p = new THREE.Group(); p.position.set(x, y, 0);
    const m = box(w, len, w, mat); m.position.y = -len / 2; p.add(m);
    body.add(p); return p;
  };
  const legL = limb(-.12, .82, .16, .8, skin), legR = limb(.12, .82, .16, .8, skin);
  const armL = limb(-.32, 1.5, .12, .6, shirt), armR = limb(.32, 1.5, .12, .6, shirt);
  let ph = Math.random() * 6;
  return {
    root,
    setColor(c) { shirt.color.set(c); },
    update(dt, s) {
      ph += dt * (3 + s * 1.6);
      const a = Math.min(1, s / 6) * 0.9, sw = Math.sin(ph) * a;
      legL.rotation.x = sw; legR.rotation.x = -sw;
      armL.rotation.x = -sw * .8; armR.rotation.x = sw * .8;
      body.position.y = Math.abs(Math.sin(ph)) * a * .08;
      body.rotation.x = a * .15;
    },
  };
}

function makeEntity(color, x, z) {
  const ch = xbot ? makeXbot(color) : makeProcedural(color);
  scene.add(ch.root);
  return { ch, x, z, vx: 0, vz: 0, heading: 0 };
}

function place(e, dt, look, fixedHeading) {
  const s = Math.hypot(e.vx, e.vz);
  if (fixedHeading !== undefined) e.heading = fixedHeading;
  else {
    const target = s > 0.3 ? Math.atan2(e.vx, e.vz) : look ? Math.atan2(look.x - e.x, look.z - e.z) : e.heading;
    e.heading = lerpAngle(e.heading, target, 1 - Math.exp(-dt * 10));
  }
  e.ch.root.position.set(e.x, 0, e.z);
  e.ch.root.rotation.y = e.heading;
  e.ch.update(dt, s);
}

function ring(color, r1, r2) {
  const m = new THREE.Mesh(new THREE.RingGeometry(r1, r2, 40),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .85, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.03;
  return m;
}

function label(text, color) {
  const [c, g] = canvas(256, 96);
  g.font = '900 64px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 10; g.strokeStyle = 'rgba(0,0,0,.7)'; g.strokeText(text, 128, 50);
  g.fillStyle = color; g.fillText(text, 128, 50);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture(c), depthTest: false }));
  s.scale.set(1.8, 0.68, 1); s.position.y = 2.45; s.renderOrder = 10;
  return s;
}

const npcs = [], stewards = [];
let star, starRing, invader, ball, ballMesh;

function buildPeople() {
  // 4-4-2: guarda-redes, defesas, médios, avançados
  const shape = [[-49, 0], [-36, -20], [-38, -7], [-38, 7], [-36, 20], [-20, -22], [-22, -7], [-22, 7], [-20, 22], [-7, -9], [-7, 9]];
  for (const [side, color, gk] of [[1, COLORS.home, '#1aa34a'], [-1, COLORS.away, '#f4a300']]) {
    shape.forEach(([x, z], i) => {
      const e = makeEntity(i === 0 ? gk : color, x * side, z * side);
      Object.assign(e, { homeX: e.x, homeZ: e.z, tx: e.x, tz: e.z, wait: rand(0, 3), spd: 1.3, heading: side * Math.PI / 2 });
      npcs.push(e);
    });
  }
  star = npcs[10];
  star.cool = 0;
  starRing = ring('#ffd166', 0.7, 0.95);
  star.ch.root.add(starRing, label('★ 10', '#ffd166'));

  const ref = makeEntity(COLORS.ref, 0, 12);
  Object.assign(ref, { isRef: true, homeX: 0, homeZ: 12, tx: 0, tz: 12, wait: 1, spd: 1.3 });
  npcs.push(ref);

  invader = makeEntity(COLORS.invader, 0, 36);
  invader.ch.root.add(ring(COLORS.invader, 0.55, 0.8));
  invader.ch.root.visible = false;

  for (let i = 0; i < 18; i++) {
    const s = makeEntity(COLORS.steward, 0, 0);
    s.active = false; s.ch.root.visible = false;
    stewards.push(s);
  }

  ballMesh = new THREE.Mesh(new THREE.SphereGeometry(BR, 24, 16), new THREE.MeshStandardMaterial({ map: ballTexture(), roughness: .5 }));
  ballMesh.castShadow = true;
  scene.add(ballMesh);
  ball = { x: 0, z: 0, vx: 0, vz: 0 };
}

// ---------- Som ----------
let ac, amb;
function audio() {
  if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function beep(f, d, type = 'square', v = 0.06) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + d);
}
function noise(len) {
  const a = audio();
  const buf = a.createBuffer(1, a.sampleRate * len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), f = a.createBiquadFilter();
  s.buffer = buf; f.type = 'lowpass';
  s.connect(f);
  return [s, f];
}
function roar(len = 1.6) {
  const a = audio(); if (!a) return;
  const [s, f] = noise(len), g = a.createGain();
  f.frequency.value = 900;
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.25, a.currentTime + 0.15);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + len);
  f.connect(g).connect(a.destination);
  s.start();
}
function ambience() {
  const a = audio(); if (!a || amb) return;
  const [s, f] = noise(3);
  amb = a.createGain(); amb.gain.value = 0.035;
  f.frequency.value = 600; s.loop = true;
  f.connect(amb).connect(a.destination);
  s.start();
}
function whistle() {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), lfo = a.createOscillator(), lg = a.createGain(), g = a.createGain();
  o.frequency.value = 2900; lfo.frequency.value = 28; lg.gain.value = 180;
  lfo.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(0.07, a.currentTime);
  g.gain.setValueAtTime(0.07, a.currentTime + 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.8);
  o.connect(g).connect(a.destination);
  o.start(); lfo.start(); o.stop(a.currentTime + 0.8); lfo.stop(a.currentTime + 0.8);
}

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' || e.code === 'Enter') {
    if (state === 'menu' || state === 'over') tryStart();
    else if (state === 'play' && e.code === 'Space') dash();
  }
  if (e.code === 'KeyC' && !e.repeat && state !== 'loading') setCamMode(camMode + 1);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const pointer = { active: false, cx: 0, cy: 0, sx: 0, sy: 0, lastTap: 0 };
const locked = () => document.pointerLockElement === renderer.domElement;
function lockMouse() {
  if (!relControls() || lastPointerType === 'touch' || locked()) return;
  try { const p = renderer.domElement.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}
addEventListener('pointerdown', e => { lastPointerType = e.pointerType; }, true);
renderer.domElement.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  // Rato nas câmaras de primeira pessoa / ombro: prende o cursor; clique = finta
  if (relControls() && e.pointerType === 'mouse') {
    if (locked()) dash(); else lockMouse();
    return;
  }
  const now = performance.now();
  if (now - pointer.lastTap < 280) dash();     // toque duplo = finta
  pointer.lastTap = now;
  Object.assign(pointer, { active: true, cx: e.clientX, cy: e.clientY, sx: e.clientX, sy: e.clientY });
});
addEventListener('mousemove', e => {
  if (!locked() || state !== 'play') return;
  yaw -= e.movementX * 0.0022;
  pitch = clamp(pitch - e.movementY * 0.0022, -0.9, 0.7);
});
$('camBtn').addEventListener('click', e => { e.stopPropagation(); setCamMode(camMode + 1); e.currentTarget.blur(); });

let toastT;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

function setCamMode(i) {
  camMode = (i + CAM_MODES.length) % CAM_MODES.length;
  try { localStorage.setItem('invasao3d-cam', camMode); } catch (e) {}
  $('camBtn').textContent = '📷 ' + CAM_MODES[camMode].name;
  if (invader) yaw = invader.heading;
  pitch = 0;
  if (!relControls() && locked()) document.exitPointerLock();
  if (state === 'loading') return;
  if (state === 'menu') showMenu();
  const touch = lastPointerType === 'touch';
  toast(`📷 ${CAM_MODES[camMode].name} — ` + (!relControls()
    ? (touch ? 'toca onde queres ir' : 'WASD / setas movem no ecrã')
    : touch ? 'arrasta o dedo: cima = correr, lados = rodar'
            : 'clica para olhar com o rato · W/S frente/trás · A/D lado · Q/E rodar · clique = finta'));
}
addEventListener('pointermove', e => { if (pointer.active) { pointer.cx = e.clientX; pointer.cy = e.clientY; } });
addEventListener('pointerup', () => { pointer.active = false; });
addEventListener('pointercancel', () => { pointer.active = false; });
$('overlay').addEventListener('click', () => { if (state === 'menu' || state === 'over') tryStart(); });

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
function pointerGround() {
  ndc.set(pointer.cx / innerWidth * 2 - 1, -(pointer.cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  return raycaster.ray.intersectPlane(groundPlane, hit);
}

// ---------- Estado do jogo ----------
let state = 'loading', overAt = 0;
let time = 0, selfies = 0, goals = 0, spawnT = 0, spawnCount = 0;
let stamina = 100, dashT = 0, dashCd = 0, dashDir = { x: 0, z: -1 }, shake = 0, celebrate = 0, lastKick = 0;
let best = 0;
try { best = +localStorage.getItem('invasao3d-best') || 0; } catch (e) {}

const score = () => Math.floor(time * 10) + selfies * 100 + goals * 300;

function reset() {
  Object.assign(invader, { x: 0, z: 36, vx: 0, vz: 0, heading: Math.PI });
  yaw = Math.PI; pitch = 0;
  for (const s of stewards) { s.active = false; s.ch.root.visible = false; }
  Object.assign(ball, { x: 0, z: 0, vx: 0, vz: 0 });
  star.cool = 0;
  time = 0; selfies = 0; goals = 0; spawnT = 0; spawnCount = 0;
  stamina = 100; dashT = 0; dashCd = 0; shake = 0;
  spawnSteward(); spawnSteward();
}

function tryStart() {
  if (state === 'over' && performance.now() - overAt < 700) return;
  audio(); ambience();
  reset();
  state = 'play';
  $('overlay').classList.add('hidden');
  $('hud').classList.remove('hidden');
  $('map').classList.remove('hidden');
  lockMouse();
  roar(2);
}

function gameOver() {
  state = 'over'; overAt = performance.now();
  if (locked()) document.exitPointerLock();
  pointer.active = false;
  whistle(); shake = 0.4;
  invader.vx = invader.vz = 0;
  const sc = score(), record = sc > best;
  if (record) { best = sc; try { localStorage.setItem('invasao3d-best', best); } catch (e) {} }
  const o = $('overlay');
  o.innerHTML = `<div class="card">
    <h1 class="red">APANHADO! 🚨</h1>
    <p class="big">${sc} pontos</p>
    <p>${time.toFixed(1)}s em campo · ${selfies} selfies · ${goals} golos</p>
    <p style="color:var(--gold);font-weight:700">${record ? '🏆 Novo recorde!' : 'Recorde: ' + best}</p>
    <div class="cta" id="again" style="visibility:hidden">ESPAÇO ou clica para tentar outra vez</div>
  </div>`;
  o.classList.remove('hidden');
  setTimeout(() => { const a = $('again'); if (a) a.style.visibility = 'visible'; }, 700);
}

function showMenu() {

      <span>⚽</span><span>Marca golo com a bola</span><em>+300</em>

    </div>

    <p class="keys">Telemóvel: arrasta o dedo para mover · toque duplo para a finta</p>

    <div class="cta">Prime ESPAÇO ou clica para começar</div>

function spawnSteward() {
  const s = stewards.find(s => !s.active);
  if (!s) return;
  let pos;
  for (let i = 0; i < 12; i++) {
    const side = Math.floor(Math.random() * 4);
    pos = side < 2 ? { x: rand(-50, 50), z: side ? 39 : -39 } : { x: side === 2 ? 57.5 : -57.5, z: rand(-32, 32) };
    if (dist(pos, invader) > 25) break;
  }
  spawnCount++;
  const police = time > 25 && spawnCount % 3 === 0;
  s.ch.setColor(police ? COLORS.police : COLORS.steward);
  Object.assign(s, pos, {
    vx: 0, vz: 0, active: true, police,
    base: police ? 7.2 : rand(4.9, 5.5), cap: police ? 8.6 : 7.4,
    lead: police ? 0.25 : rand(0.3, 0.9), wob: rand(0, 10),
    heading: Math.atan2(invader.x - pos.x, invader.z - pos.z),
  });
  s.ch.root.visible = true;
}

function dash() {
  if (state !== 'play' || dashCd > 0) return;
  const sp = Math.hypot(invader.vx, invader.vz);
  if (sp > 0.5) dashDir = { x: invader.vx / sp, z: invader.vz / sp };
  else if (relControls()) dashDir = { x: Math.sin(yaw), z: Math.cos(yaw) };
  dashT = DASH_TIME; dashCd = DASH_CD;
  beep(520, 0.12, 'triangle', 0.08);
}

// ---------- Texto flutuante / flash ----------
const floats = [], proj = new THREE.Vector3();
function float(text, x, z, color, huge = false) {
  const el = document.createElement('div');
  el.className = 'float' + (huge ? ' huge' : '');
  el.textContent = text; el.style.color = color;
  document.body.appendChild(el);
  floats.push({ el, x, z, t: 0 });
}
function updateFloats(dt) {
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.t += dt;
    if (f.t > 1.4) { f.el.remove(); floats.splice(i, 1); continue; }
    proj.set(f.x, 2.8 + f.t * 1.5, f.z).project(camera);
    f.el.style.transform = `translate(${(proj.x + 1) / 2 * innerWidth}px, ${(1 - proj.y) / 2 * innerHeight}px) translate(-50%, -50%)`;
    f.el.style.opacity = 1 - f.t / 1.4;
  }
}
function flash() {
  const f = $('flash');
  f.style.transition = 'none'; f.style.opacity = '.8';
  void f.offsetWidth;
  f.style.transition = 'opacity .45s'; f.style.opacity = '0';
}

// ---------- Lógica ----------
function updatePlay(dt) {
  time += dt;
  dashCd = Math.max(0, dashCd - dt);

  // Movimento do invasor
  let ix = 0, iz = 0, far = false;
  if (relControls()) {
    // Controlos relativos para onde estás a olhar
    let fwd = 0, side = 0, turn = 0;
    if (keys.KeyW || keys.ArrowUp) fwd++;
    if (keys.KeyS || keys.ArrowDown) fwd--;
    if (keys.KeyD) side++;
    if (keys.KeyA) side--;
    if (keys.KeyE || keys.ArrowRight) turn++;
    if (keys.KeyQ || keys.ArrowLeft) turn--;
    if (pointer.active) {                       // joystick virtual no telemóvel
      const jx = pointer.cx - pointer.sx, jy = pointer.cy - pointer.sy;
      turn += clamp(jx / 70, -1, 1);
      fwd += clamp(-jy / 50, -1, 1);
      far = -jy > 110;
    }
    yaw -= turn * 2.6 * dt;
    const fx = Math.sin(yaw), fz = Math.cos(yaw), rx = -Math.cos(yaw), rz = Math.sin(yaw);
    ix = fx * fwd + rx * side;
    iz = fz * fwd + rz * side;
  } else {
    if (keys.ArrowLeft || keys.KeyA) ix--;
    if (keys.ArrowRight || keys.KeyD) ix++;
    if (keys.ArrowUp || keys.KeyW) iz--;
    if (keys.ArrowDown || keys.KeyS) iz++;
    if (pointer.active) {
      const g = pointerGround();
      if (g) {
        const dx = g.x - invader.x, dz = g.z - invader.z, d = Math.hypot(dx, dz);
        if (d > 0.6) { ix = dx / d; iz = dz / d; far = d > 8; }
      }
    }
  }
  const il = Math.hypot(ix, iz);
  if (il > 1) { ix /= il; iz /= il; }

  const sprinting = (keys.ShiftLeft || keys.ShiftRight || far) && il > 0.2 && stamina > 0;
  stamina = sprinting ? Math.max(0, stamina - 30 * dt) : Math.min(100, stamina + 15 * dt);
  let tvx = ix * (sprinting ? SPRINT : RUN), tvz = iz * (sprinting ? SPRINT : RUN);
  const k = 1 - Math.exp(-dt * 10);
  if (dashT > 0) {
    dashT -= dt;
    invader.vx = dashDir.x * DASH; invader.vz = dashDir.z * DASH;
  } else {
    invader.vx += (tvx - invader.vx) * k;
    invader.vz += (tvz - invader.vz) * k;
  }
  invader.x = clamp(invader.x + invader.vx * dt, -55, 55);
  invader.z = clamp(invader.z + invader.vz * dt, -37, 37);
  for (const n of npcs) {
    const d = dist(invader, n);
    if (d > 0 && d < 0.75) {
      invader.x = n.x + (invader.x - n.x) / d * 0.75;
      invader.z = n.z + (invader.z - n.z) / d * 0.75;
    }
  }

  // Selfie com o craque
  star.cool = Math.max(0, star.cool - dt);
  if (star.cool === 0 && dist(invader, star) < 1.5) {
    selfies++;
    star.cool = 2.5;
    flash();
    float('+100 SELFIE! 📸', star.x, star.z, '#ffd166');
    beep(880, 0.08); setTimeout(() => beep(1320, 0.12), 80);
    let far = null;
    for (let i = 0; i < 10; i++) {
      const c = { x: rand(-45, 45), z: rand(-28, 28) };
      if (!far || dist(c, invader) > dist(far, invader)) far = c;
    }
    Object.assign(star, { tx: far.x, tz: far.z, spd: 6.5, wait: 3 });
    spawnSteward();
  }

  updateBall(dt);

  // Seguranças
  spawnT += dt;
  if (spawnT > 7) { spawnT = 0; spawnSteward(); }
  for (const s of stewards) {
    if (!s.active) continue;
    const spd = Math.min(s.base + time * 0.045, s.cap);
    const dx = invader.x + invader.vx * s.lead - s.x, dz = invader.z + invader.vz * s.lead - s.z;
    const d = Math.hypot(dx, dz) || 1;
    s.wob += dt * 2.5;
    let mx = dx / d + Math.cos(s.wob) * .12, mz = dz / d + Math.sin(s.wob) * .12;
    for (const o of stewards) {
      if (o === s || !o.active) continue;
      const ox = s.x - o.x, oz = s.z - o.z, od = Math.hypot(ox, oz);
      if (od > 0 && od < 1.8) { mx += ox / od * .7; mz += oz / od * .7; }
    }
    for (const n of npcs) {
      const ox = s.x - n.x, oz = s.z - n.z, od = Math.hypot(ox, oz);
      if (od > 0 && od < 1.2) { mx += ox / od * .9; mz += oz / od * .9; }
    }
    const ml = Math.hypot(mx, mz) || 1;
    s.vx = mx / ml * spd; s.vz = mz / ml * spd;
    s.x += s.vx * dt; s.z += s.vz * dt;
    if (dashT <= 0 && dist(s, invader) < 0.9) { gameOver(); return; }
  }
}

function updateBall(dt) {
  const R = 0.45 + BR;
  const d = dist(invader, ball);
  if (d < R) {
    const nx = (ball.x - invader.x) / (d || 1), nz = (ball.z - invader.z) / (d || 1);
    const kick = Math.max(6, Math.hypot(invader.vx, invader.vz) * 1.6);
    ball.vx = nx * kick; ball.vz = nz * kick;
    ball.x = invader.x + nx * (R + .01); ball.z = invader.z + nz * (R + .01);
    if (performance.now() - lastKick > 150) { beep(170, 0.05, 'sine', 0.12); lastKick = performance.now(); }
  }
  for (const p of npcs.concat(stewards.filter(s => s.active))) {
    const pd = dist(p, ball);
    if (pd > 0 && pd < R) {
      const nx = (ball.x - p.x) / pd, nz = (ball.z - p.z) / pd;
      ball.x = p.x + nx * R; ball.z = p.z + nz * R;
      const dot = ball.vx * nx + ball.vz * nz;
      if (dot < 0) { ball.vx -= 1.6 * dot * nx; ball.vz -= 1.6 * dot * nz; }
    }
  }
  ball.x += ball.vx * dt; ball.z += ball.vz * dt;
  const f = Math.pow(0.5, dt);
  ball.vx *= f; ball.vz *= f;

  const inMouth = Math.abs(ball.z) < GOAL_W - BR;
  if (inMouth && Math.abs(ball.x) > HL + BR * 2) {
    goals++;
    float('GOLOOOO! +300', ball.x, ball.z, '#7cf29c', true);
    roar(2.5); shake = 0.6; celebrate = 2.5;
    Object.assign(ball, { x: 0, z: 0, vx: 0, vz: 0 });
    spawnSteward();
    return;
  }
  if (!inMouth) {
    if (ball.x < -HL + BR) { ball.x = -HL + BR; ball.vx = Math.abs(ball.vx) * .6; }
    if (ball.x > HL - BR) { ball.x = HL - BR; ball.vx = -Math.abs(ball.vx) * .6; }
  }
  if (ball.z < -HW + BR) { ball.z = -HW + BR; ball.vz = Math.abs(ball.vz) * .6; }
  if (ball.z > HW - BR) { ball.z = HW - BR; ball.vz = -Math.abs(ball.vz) * .6; }
}

const rollAxis = new THREE.Vector3();
function placeBall(dt) {
  const sp = Math.hypot(ball.vx, ball.vz);
  if (sp > 0.01) {
    rollAxis.set(ball.vz / sp, 0, -ball.vx / sp);
    ballMesh.rotateOnWorldAxis(rollAxis, sp * dt / BR);
  }
  ballMesh.position.set(ball.x, BR, ball.z);
}

function updateNpcs(dt) {
  for (const n of npcs) {
    if (n.isRef) { n.homeX = clamp(ball.x - 8, -45, 45); n.homeZ = clamp(ball.z + 10, -30, 30); }
    const dx = n.tx - n.x, dz = n.tz - n.z, d = Math.hypot(dx, dz);
    if (d < 0.3) {
      n.vx = n.vz = 0;
      n.wait -= dt;
      if (n.wait <= 0) {
        n.tx = clamp(n.homeX + rand(-5, 5), -HL + 1, HL - 1);
        n.tz = clamp(n.homeZ + rand(-5, 5), -HW + 1, HW - 1);
        n.wait = rand(1.5, 5);
        n.spd = n.isRef ? 2.2 : 1.3;
      }
    } else {
      n.vx = dx / d * n.spd; n.vz = dz / d * n.spd;
      n.x += n.vx * dt; n.z += n.vz * dt;
    }
  }
}

// ---------- Câmara ----------
const camPos = new THREE.Vector3(0, 40, 80), camLook = new THREE.Vector3(), tmp = new THREE.Vector3();
function updateCamera(dt) {
  const m = mode();
  let fov = CAM_MODES[camMode].fov;
  const fx = Math.sin(yaw), fz = Math.cos(yaw), rx = -Math.cos(yaw), rz = Math.sin(yaw);

  if (state === 'loading' || state === 'menu') {
    const a = performance.now() * 0.00006;
    camPos.set(Math.sin(a) * 80, 40, Math.cos(a) * 80);
    camLook.set(0, 0, 0);
    camera.position.copy(camPos);
    camera.lookAt(camLook);
    fov = 50;
  } else if (m === 'tv') {
    const k = 1 - Math.exp(-dt * 4);
    camPos.lerp(tmp.set(invader.x * 0.92, 15, invader.z + 18), k);
    camLook.lerp(tmp.set(invader.x + invader.vx * 0.25, 1, invader.z - 3 + invader.vz * 0.25), k * 1.5);
    camera.position.copy(camPos);
    camera.lookAt(camLook);
  } else if (m === 'ombro') {
    const k = 1 - Math.exp(-dt * 8);
    camPos.lerp(tmp.set(invader.x - fx * 4.2 + rx * 0.7, 2.3, invader.z - fz * 4.2 + rz * 0.7), k);
    camLook.set(invader.x + fx * 8, 1.2 + pitch * 6, invader.z + fz * 8);
    camera.position.copy(camPos);
    camera.lookAt(camLook);
  } else {
    // Primeira pessoa: GoPro no peito ou câmara na cabeça
    const chest = m === 'peito';
    const sp = Math.hypot(invader.vx, invader.vz), amp = Math.min(1, sp / 7);
    bobPh += dt * sp * 1.4;
    let y = (chest ? 1.3 : 1.68) + Math.abs(Math.sin(bobPh)) * (chest ? 0.09 : 0.05) * amp;
    const lat = Math.sin(bobPh) * (chest ? 0.05 : 0.025) * amp, fwd = chest ? 0.28 : 0.12;
    let roll = Math.sin(bobPh) * (chest ? 0.04 : 0.015) * amp;
    let p = pitch + (chest ? -0.15 : -0.08) + Math.cos(bobPh * 2) * (chest ? 0.015 : 0.006) * amp;
    if (chest && sp > 8) { p += rand(-0.008, 0.008); roll += rand(-0.01, 0.01); }
    if (state === 'over') {                      // apanhado: a câmara cai ao chão
      const f = Math.min(1, (performance.now() - overAt) / 600);
      y += (0.35 - y) * f; roll += f * 0.9; p += (0.35 - p) * f;
    }
    camPos.set(invader.x + fx * fwd + rx * lat, y, invader.z + fz * fwd + rz * lat);
    camLook.set(invader.x + fx * 10, 0, invader.z + fz * 10);
    camera.position.copy(camPos);
    camera.rotation.set(p, yaw + Math.PI, roll, 'YXZ');
  }
  if (state === 'play' && dashT > 0) fov += 12;
  if (Math.abs(camera.fov - fov) > 0.01) {
    camera.fov += (fov - camera.fov) * Math.min(1, dt * 10);
    camera.updateProjectionMatrix();
  }
  if (shake > 0) camera.position.add(tmp.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shake * (firstPerson() ? 0.15 : 0.8)));
  sun.position.set(camLook.x + 25, 45, camLook.z + 20);
  sun.target.position.copy(camLook);
}

// ---------- HUD / mini-mapa ----------
const mapCtx = $('map').getContext('2d');
function updateHud() {
  $('sScore').textContent = score();
  $('sTime').textContent = time.toFixed(1);
  $('sSelfies').textContent = selfies;
  $('sGoals').textContent = goals;
  $('sStewards').textContent = stewards.filter(s => s.active).length;
  const st = $('sStamina');
  st.style.width = stamina + '%';
  st.style.background = stamina > 30 ? '#4ade80' : '#f87171';
  const p = 1 - dashCd / DASH_CD;
  $('dash').style.background = dashCd > 0 ? `conic-gradient(var(--pink) ${p * 360}deg, #444 0)` : 'var(--pink)';
}

function drawMap() {
  const g = mapCtx, S = 2, O = 8, W = 226, H = 152;
  const px = x => clamp(O + (x + HL) * S, 2, W - 2), pz = z => clamp(O + (z + HW) * S, 2, H - 2);
  g.clearRect(0, 0, W, H);
  g.fillStyle = 'rgba(40,120,50,.85)'; g.fillRect(O, O, 105 * S, 68 * S);
  g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 1;
  g.strokeRect(O, O, 105 * S, 68 * S);
  g.beginPath(); g.moveTo(px(0), O); g.lineTo(px(0), O + 68 * S); g.stroke();
  g.beginPath(); g.arc(px(0), pz(0), 9.15 * S, 0, Math.PI * 2); g.stroke();
  g.strokeRect(O - 4, pz(-GOAL_W), 4, GOAL_W * 2 * S);
  g.strokeRect(O + 105 * S, pz(-GOAL_W), 4, GOAL_W * 2 * S);
  const dot = (e, r, color, stroke) => {
    g.fillStyle = color; g.beginPath(); g.arc(px(e.x), pz(e.z), r, 0, Math.PI * 2); g.fill();
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1.5; g.stroke(); }
  };
  for (const n of npcs) if (n !== star) dot(n, 2, 'rgba(255,255,255,.35)');
  dot(star, 3.5, star.cool === 0 ? '#ffd166' : '#8a7440');
  dot(ball, 2.2, '#fff');
  for (const s of stewards) if (s.active) dot(s, 3, s.police ? '#5b8cff' : '#ffcc00', '#000');
  // cone de visão do invasor
  const a = Math.atan2(Math.cos(invader.heading), Math.sin(invader.heading));
  g.fillStyle = 'rgba(193,75,255,.35)';
  g.beginPath(); g.moveTo(px(invader.x), pz(invader.z));
  g.arc(px(invader.x), pz(invader.z), 22, a - 0.5, a + 0.5); g.closePath(); g.fill();
  dot(invader, 4, COLORS.invader, '#fff');
}

// Efeitos de ecrã das câmaras (GoPro, cansaço, aviso de perigo)
const pad2 = n => String(n).padStart(2, '0');
function updateFx() {
  const inGame = state === 'play' || state === 'over', fp = inGame && firstPerson();
  $('gopro').classList.toggle('hidden', !(fp && mode() === 'peito'));
  if (fp && mode() === 'peito') $('tc').textContent = `${pad2(Math.floor(time / 60))}:${pad2(Math.floor(time % 60))}:${pad2(Math.floor(time % 1 * 30))}`;
  $('vig').style.opacity = fp && mode() === 'cabeca' ? 0.55 : 0;
  $('tired').style.opacity = fp && state === 'play' ? clamp((35 - stamina) / 35, 0, 1) * (0.45 + Math.sin(performance.now() / 160) * 0.15) : 0;
  let behind = false;
  if (state === 'play' && relControls()) {
    const fx = Math.sin(yaw), fz = Math.cos(yaw);
    for (const s of stewards) {
      if (!s.active) continue;
      const d = dist(s, invader);
      if (d < 6 && ((s.x - invader.x) * fx + (s.z - invader.z) * fz) / d < 0.35) behind = true;
    }
  }
  $('warn').classList.toggle('hidden', !behind);
}

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  shake = Math.max(0, shake - dt);
  celebrate = Math.max(0, celebrate - dt);

  if (state !== 'loading') {
    if (state === 'play') updatePlay(dt);
    else for (const s of stewards) s.vx = s.vz = 0;
    updateNpcs(dt);

    const inGame = state === 'play' || state === 'over';
    invader.ch.root.visible = inGame && !firstPerson();     // na 1ª pessoa não vês o teu próprio corpo
    const look = inGame ? invader : ball;
    for (const n of npcs) place(n, dt, look);
    for (const s of stewards) if (s.active) place(s, dt, invader);
    if (inGame) place(invader, dt, null, relControls() ? yaw : undefined);
    placeBall(dt);

    starRing.visible = star.cool === 0;
    starRing.scale.setScalar(1 + Math.sin(now / 180) * 0.12);
    for (const t of standTexs) t.offset.y = celebrate > 0 ? Math.abs(Math.sin(now * 0.02)) * 0.05 : 0;

    if (state === 'play') { updateHud(); drawMap(); }
    updateFx();
  }
  updateCamera(dt);
  updateFloats(dt);
  if (mode() === 'peito' && (state === 'play' || state === 'over')) composer.render();
  else renderer.render(scene, camera);
}

$('camBtn').textContent = '📷 ' + CAM_MODES[camMode].name;
buildStadium();
requestAnimationFrame(loop);
xbot = await loadXbot();
buildPeople();
state = 'menu';
showMenu();
</script>
